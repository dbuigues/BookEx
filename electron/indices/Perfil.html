<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookEx - Mi perfil</title>
    <link rel="stylesheet" href="../estilos/styles.css">
</head>

<body>
    <!-- HEADER -->
    <header>
        <div class="header-content">
            <a href="index.html" class="nodeco">
                <div class="logo">
                    <img src="../assets/imagenes/logo.png" alt="BookEx Logo" class="logo-img">
                    <span>BookEx</span>
                </div>
            </a>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="BuscarLibro.html">Buscar libro</a>
                <a href="Reseñas.html">Mis reseñas</a>
                <a href="Listas.html">Mis listas</a>
                <a href="Perfil.html" class="active">Perfil</a>
            </nav>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container animate-slideDown">

        <!-- REGISTRO -->
        <div class="section" id="registerSection">
            <h2 class="section-title">Registrarse</h2>
            <form onsubmit="return false">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="regName">Nombre de usuario</label>
                    <input type="text" id="regName" name="regName" required placeholder="Tu nombre de usuario" maxlength="255"><br>
                    <label for="regEmail">Correo electrónico</label>
                    <input type="email" id="regEmail" name="regEmail" required placeholder="Correo electrónico" maxlength="255"><br>
                    <label for="regPassword">Contraseña</label>
                    <input type="password" id="regPassword" name="regPassword" required placeholder="Contraseña" maxlength="255"><br>
                    <label for="regPassword2">Repetir contraseña</label>
                    <input type="password" id="regPassword2" name="regPassword2" required placeholder="Repite la contraseña" maxlength="255"><br>
                    <label for="regFotoPerfil">Foto de Perfil:</label>
                    <input type="file" id="regFotoPerfil" accept="image/*">
                </div>
                <button type="submit" id="regUserButton">
                    Registrarse
                </button>
                <span class="form-group" id="RegisterError"></span>
                <hr style="margin-top: 10px;">
                <div style="display: flex; padding-top: 10px; align-items: center;">
                    <p>¿Ya tienes cuenta?</p>
                    <button id="cambiarAIniciar" style="width: 50%; margin-left: auto;">
                        Iniciar sesión
                    </button>
                </div>
                <script src="../funciones/register.js"></script>
            </form>
        </div>

        <!-- LOGIN -->
        <div class="section" id="loginSection">
            <h2 class="section-title">Iniciar sesión</h2>
            <form onsubmit="return false">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="logEmail" name="email" required placeholder="usuario@ejemplo.com">
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="password">Contraseña</label>
                    <input type="password" id="logPassword" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" id="LogUserButton">Iniciar Sesión</button>
                <span class="form-group" id="LoginError"></span>
                <hr style="margin-top: 10px;">
                <div style="display: flex; padding-top: 10px; align-items: center;">
                    <p>¿No tienes cuenta?</p>
                    <button id="cambiarARegistrar" style="width: 50%; margin-left: auto;">
                        Regístrate
                    </button>
                </div>
                <script src="../funciones/login.js"></script>
            </form>
        </div>

        <!-- BIENVENIDO -->
        <div id="userInfo" class="hidden">
            <div class="page-title">
                <h1 id="welcomeUser">Bienvenido de nuevo</h1>
                <img id="userProfilePic" src="" alt="Foto de perfil" class="profile-pic">
            </div>
        </div>

        <button id="cerrarSesion" style="display: none;">Cerrar Sesión</button>
    </div>

    <footer>
        <p>&copy; 2026 BookEx. Plataforma de reseñas y opiniones de libros.</p>
    </footer>
    <script src="../funciones/profileController.js"></script>
    <script src="../funciones/comunes.js"></script>
</body>

</html>
