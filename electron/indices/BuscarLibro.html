<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookEx</title>
    <link rel="stylesheet" href="../estilos/styles.css">
    <style>
        .search-row{display:flex;gap:16px;align-items:flex-end;margin-bottom:20px}
        .search-column{flex:1;min-width:0}
        .search-column label{display:block;margin-bottom:6px;font-weight:600}
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-content">
            <div class="logo">
                <img src="../assets/imagenes/logo.png" alt="BookEx Logo" class="logo-img">
                <span>BookEx</span>
            </div>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="BuscarLibro.html" class="active">Buscar libro</a>
                <a href="Reseñas.html">Mis reseñas</a>
                <a href="Listas.html">Mis listas</a>
                <a href="Perfil.html">Perfil</a>
            </nav>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container animate-slideDown">

        <div class="search-row">
            <div class="search-column">
                <label for="searchNameInput">Título</label>
                <input type="text" id="searchNameInput" placeholder="Nombre del libro..." class="search-input">
            </div>
            <div class="search-column">
                <label for="searchAuthorInput">Autor</label>
                <input type="text" id="searchAuthorInput" placeholder="Nombre del autor..." class="search-input">
            </div>
            <div class="search-column">
                <label for="searchISBNInput">ISBN</label>
                <input type="text" id="searchISBNInput" placeholder="ISBN del libro..." class="search-input">
            </div>
        </div>
        <div class="section">
            <h2 class="section-title">Resultados</h2>
            <div class="cards-grid" id="booksResultsContainer"></div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 BookEx. Plataforma de reseñas y opiniones de libros.</p>
    </footer>
    <script src="../funciones/imageCache.js"></script>
    <script src="../funciones/searchBooks.js"></script>
    <script src="../funciones/comunes.js"></script>
</body>
</html>
