<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookEx</title>
    <link rel="stylesheet" href="../estilos/styles.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-content">
            <div class="logo">
                <img src="../assets/imagenes/logo.png" alt="BookEx Logo" class="logo-img">
                <span>BookEx</span>
            </div>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="BuscarLibro.html" class="active">Buscar libro</a>
                <a href="Reseñas.html">Mis reseñas</a>
                <a href="Listas.html">Mis listas</a>
                <a href="Perfil.html">Perfil</a>
            </nav>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container animate-slideDown">

        <div class="section">
            <h2 class="section-title">Buscar por nombre</h2>
            <input type="text" id="searchNameInput" placeholder="Nombre del libro..." class="search-input">            
            <div class="cards-grid" id="booksNameContainer"></div>
        </div>
        <div class="section">
            <h2 class="section-title">Buscar por isbn</h2>
            <input type="text" id="searchISBNInput" placeholder="ISBN del libro..." class="search-input">            
            <div class="cards-grid" id="booksISBNContainer"></div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 BookEx. Plataforma de reseñas y opiniones de libros.</p>
    </footer>
    <script src="../funciones/searchBooks.js"></script>
</body>
</html>
