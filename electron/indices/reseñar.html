<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Libro | BookEx</title>
    <link rel="stylesheet" href="../estilos/styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <img src="../assets/imagenes/logo.png" alt="BookEx Logo" class="logo-img">
                <span>BookEx</span>
            </div>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="BuscarLibro.html">Buscar libro</a>
                <a href="Reseñas.html">Mis reseñas</a>
                <a href="Listas.html">Mis listas</a>
                <a href="Perfil.html">Perfil</a>
            </nav>
        </div>
    </header>
    <main>
    <div class="container animate-slideDown">
        <div class="page-title">

        </div>
        <div class="section">
            <div class="book-detail">
                <h2 id="bookTitle">Título del libro</h2>
                <p id="bookAuthor">Autor</p>
                <img id="bookCover" src="../assets/imagenes/logo.png" alt="Portada del libro" class="book-cover">
                <div class="book-info">
                    <p><strong>Género:</strong> <span id="bookGenre"></span></p>
                </div>
            </div>
        </div>
    </div>

    <div>
        <div class="book-detail">
        <h2>Escribe tu reseña</h2>
        <div class="rating-container">
            <label>Puntuación:</label>
            <div class="star-rating">
                <input type="radio" id="star5" name="rating" value="5" />
                <label for="star5" title="5 estrellas">★</label>
                <input type="radio" id="star4" name="rating" value="4" />
                <label for="star4" title="4 estrellas">★</label>
                <input type="radio" id="star3" name="rating" value="3" />
                <label for="star3" title="3 estrellas">★</label>
                <input type="radio" id="star2" name="rating" value="2" />
                <label for="star2" title="2 estrellas">★</label>
                <input type="radio" id="star1" name="rating" value="1" />
                <label for="star1" title="1 estrella">★</label>
            </div>
        </div>
        
        <textarea id="reviewText" rows="10" maxlength="2000" placeholder="Escribe tu reseña aquí..."></textarea>
        <button id="submitReview" class="btn">Enviar reseña</button>
        </div>
    </div>
    </main>
    <footer>
        <p>&copy; 2026 BookEx. Plataforma de reseñas y opiniones de libros.</p>
    </footer>
    <script src="../funciones/libro-lista.js"></script>
    <script src="../funciones/comunes.js"></script>
</body>
</html>
